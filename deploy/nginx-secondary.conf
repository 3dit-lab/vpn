# Резервный сервер портала: запросы идут на основной сервер, при его недоступности отвечает локальная копия.
# Домен, имена и основной сервер подставляет scripts/setup-replica.sh
limit_req_zone $binary_remote_addr zone=vpn_pages:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=vpn_login:10m rate=30r/m;

server {
    listen 80;
    server_name __DOMAIN__ __ALIASES__;

    # выпуск и продление сертификата идёт на основном сервере: проверочные запросы могут прийти сюда
    location /.well-known/acme-challenge/ {
        proxy_pass http://__PRIMARY__:80;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__ __ALIASES__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:vpn_tls:10m;

    root /var/www/vpn;
    autoindex off;
    server_tokens off;

    limit_req_status 429;
    limit_req zone=vpn_pages burst=40 nodelay;
    add_header X-Content-Type-Options "nosniff" always;

    # основной сервер не отвечает (соединение, таймаут, 5xx от прокси): работает локальная копия
    error_page 502 503 504 = @local;

    location /apps/ {
        include /etc/nginx/vpn-portal-primary.inc;
        error_page 502 503 504 = @localapps;
    }

    location = /login {
        limit_req zone=vpn_login burst=5 nodelay;
        include /etc/nginx/vpn-portal-primary.inc;
    }

    location ~ ^/(admin/login|org/login|super/login)$ {
        limit_req zone=vpn_login burst=5 nodelay;
        include /etc/nginx/vpn-portal-primary.inc;
    }

    location = /super/backup {
        limit_req zone=vpn_login burst=5 nodelay;
        include /etc/nginx/vpn-portal-primary.inc;
    }

    location / {
        include /etc/nginx/vpn-portal-primary.inc;
    }

    location @local {
        include /etc/nginx/vpn-portal-proxy.inc;
    }

    location @localapps {
        index index.html;
    }
}
