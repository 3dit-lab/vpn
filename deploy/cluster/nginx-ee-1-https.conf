limit_req_zone $binary_remote_addr zone=ee_vpn_pages:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ee_vpn_login:10m rate=30r/m;

server {
    listen 443 ssl;
    server_name ee-1-vpn.3dit.ru;

    ssl_certificate /etc/letsencrypt/live/ee-1-vpn.3dit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ee-1-vpn.3dit.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    limit_req_status 429;
    limit_req zone=ee_vpn_pages burst=40 nodelay;
    add_header X-Content-Type-Options nosniff always;

    # FI-1 remains the sole writer until the database migration.
    proxy_ssl_server_name on;
    proxy_ssl_name fi-1-vpn.3dit.ru;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host vpn.3dit.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    client_max_body_size 16k;

    location ~ ^/(login|admin/login|org/login|super/login|super/backup)$ {
        limit_req zone=ee_vpn_login burst=5 nodelay;
        proxy_pass https://10.77.240.1;
    }

    location / {
        proxy_pass https://10.77.240.1;
    }
}
