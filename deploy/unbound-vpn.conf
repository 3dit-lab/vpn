# Рекурсивный DNS только для клиентов VPN: слушает адрес сервера внутри туннеля.
server:
    interface: 10.8.0.1
    ip-freebind: yes          # адрес появится вместе с awg0, порядок запуска не важен
    port: 53
    access-control: 0.0.0.0/0 refuse
    access-control: 10.8.0.0/23 allow
    do-ip6: no
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
    cache-min-ttl: 60
    num-threads: 2
