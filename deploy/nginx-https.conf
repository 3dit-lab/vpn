# Личные VPN-страницы: портал выдачи конфигов за nginx и зеркало приложений.
# Домен подставляет scripts/setup-web.sh. Общие настройки прокси: /etc/nginx/vpn-portal-proxy.inc
limit_req_zone $binary_remote_addr zone=vpn_pages:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=vpn_login:10m rate=30r/m;

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:vpn_tls:10m;

    root /var/www/vpn;
    autoindex off;
    server_tokens off;

    limit_req_status 429;
    limit_req zone=vpn_pages burst=40 nodelay;

    add_header X-Content-Type-Options "nosniff" always;

    # Установщики приложений и контрольные суммы (статика)
    location /apps/ {
        index index.html;
    }

    # Формы входа: строгий лимит запросов (дальше fail2ban банит нарушителей)
    location = /login {
        limit_req zone=vpn_login burst=5 nodelay;
        include /etc/nginx/vpn-portal-proxy.inc;
    }

    location = /admin/login {
        limit_req zone=vpn_login burst=5 nodelay;
        include /etc/nginx/vpn-portal-proxy.inc;
    }

    # Всё остальное отдаёт портал (страницы, капча, конфиги, админка)
    location / {
        include /etc/nginx/vpn-portal-proxy.inc;
    }
}
