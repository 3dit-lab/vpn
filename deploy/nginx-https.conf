# Личные страницы VPN и зеркало приложений. Домен подставляет scripts/setup-web.sh.
limit_req_zone $binary_remote_addr zone=vpn_pages:10m rate=20r/s;

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:vpn_tls:10m;

    root /var/www/vpn;
    index index.html;
    autoindex off;
    server_tokens off;

    limit_req zone=vpn_pages burst=40 nodelay;

    add_header X-Content-Type-Options "nosniff" always;

    # Корень ничего не раскрывает
    location = / {
        return 404;
    }

    # Личные страницы и конфиги: адрес содержит секретный токен, в логи он не пишется
    location /c/ {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Конфиг всегда скачивается как файл (иначе iOS Safari покажет его текстом)
        location ~ \.conf$ {
            access_log off;
            default_type application/octet-stream;
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # Установщики приложений и контрольные суммы
    location /apps/ {
        add_header X-Content-Type-Options "nosniff" always;
    }
}
